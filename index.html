<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lo que no se ve aquí 🤭</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}

.card{
    width:360px;
    background:#1b1b1b;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.card img{
    width:100%;
    display:block;
}

.content{
    padding:28px;
    text-align:center;
}

h1{
    font-size:30px;
    margin-bottom:24px;
}

.button{
    display:block;
    width:100%;
    text-decoration:none;
    background:#229ED9;
    color:white;
    padding:18px;
    border-radius:18px;
    font-size:20px;
    font-weight:bold;
    transition:.25s;
}

.button:hover{
    transform:scale(1.03);
    background:#1b8bc1;
}

.small{
    margin-top:18px;
    color:#999;
    font-size:14px;
}
</style>

</head>
<body>

<div class="card">

    <img src="foto.jpg" alt="Foto">

    <div class="content">

        <h1>Lo que no se ve aquí 🤭</h1>

        <a class="button"
           href="https://t.me/+IFjzJo4pGEg5N2Qx"
           target="_blank">
            Entrar al Telegram
        </a>

        <div class="small">
            Toca el botón para acceder.
        </div>

    </div>

</div>

</body>
</html>
